name: Release Code Tree

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: code-tree-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish validated ZIP
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download validated extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-tree-${{ github.sha }}
          path: dist

      - name: Verify downloaded release bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG" --verify "dist/code-tree-${RELEASE_TAG#v}.zip"

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          version = os.environ['RELEASE_TAG'][1:]
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## ' + re.escape(version) + r'\n(.*?)(?=^## |\Z)', changelog, re.MULTILINE | re.DOTALL)
          if section is None:
              raise SystemExit('Release changelog section is missing.')
          pathlib.Path('dist/release-notes.md').write_text(section.group(1).strip() + '\n', encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" \
            "dist/code-tree-${RELEASE_TAG#v}.zip" \
            "dist/code-tree-${RELEASE_TAG#v}.sha256" \
            --verify-tag \
            --title "Code Tree ${RELEASE_TAG#v}" \
            --notes-file dist/release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '"release=" + tojson' >> "$GITHUB_OUTPUT"

  release-labels:
    name: Update labels after publication
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout pinned labeler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ziqq/actions
          ref: ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
          path: release-actions
          persist-credentials: false

      - name: Set up labeler runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # GITHUB_TOKEN releases do not emit release.published to other workflows.
      # Run the pinned action with the API-confirmed release event explicitly.
      - name: Apply published-release transition
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const release = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${process.env.RELEASE_TAG}`], {encoding: 'utf8'}));
          if (release.draft || !release.published_at || release.tag_name !== process.env.RELEASE_TAG) throw new Error('The expected release is not published.');
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const eventPath = join(process.env.RUNNER_TEMP, 'code-tree-release-event.json');
          writeFileSync(eventPath, JSON.stringify({...event, action: 'published', release}));
          execFileSync(process.execPath, ['release-actions/labeler/dist/index.js'], {
            stdio: 'inherit',
            env: {...process.env,
              GITHUB_EVENT_NAME: 'release', GITHUB_EVENT_PATH: eventPath,
              INPUT_OPERATION: 'release-published', 'INPUT_GITHUB-TOKEN': process.env.GH_TOKEN,
              'INPUT_ALLOW-EMPTY': 'true', 'INPUT_ALLOW-PATTERN-REMOVAL': 'true',
            },
          });
          JS

  release-notifications:
    name: Notify after publication
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify about published release
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "release_tag": ${{ toJSON(fromJSON(needs.publish.outputs.release).tag_name) }},
              "release_name": ${{ toJSON(fromJSON(needs.publish.outputs.release).name) }},
              "release_url": ${{ toJSON(fromJSON(needs.publish.outputs.release).html_url) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
