name: Deploy landing

# Builds landing/ (Vite and Nunjucks, one build per locale) and publishes it
# to GitHub Pages. Pages must use the "GitHub Actions" source; the custom
# domain is configured in Pages settings.
on:
  push:
    branches: [main]
    paths:
      - landing/**
      - scripts/landing.mjs
      - package.json
      - package-lock.json
      - docs/store/icon.svg
      - docs/store/screenshots/**
      - src/icons/**
      - .github/workflows/landing.yml
  workflow_dispatch:

permissions: {}

# Never cancel a deployment in progress; a newer run waits for it.
concurrency:
  group: codetree-landing
  cancel-in-progress: false

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked tools
        run: npm ci

      - name: Build and validate
        run: npm run landing:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/landing

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
